name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# GITHUB_TOKEN 需要写权限才能给 tag 创建/更新 Release 并上传资产
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile OCR helper
        run: swiftc core/ocr_helper.swift -o core/ocr_helper -O
      - name: Build
        run: pyinstaller shorts_app.spec --noconfirm
      - name: Adhoc codesign
        run: codesign --force --deep --sign - dist/Shorts.app
      - name: Package zip + dmg
        run: |
          # macOS runner 只有 ~14GB 可用磁盘，PyInstaller 全流程(依赖+build+dist+
          # .app 90MB)会耗尽。打包前清理一切非必需缓存。
          rm -rf build ~/.pyinstaller
          pip cache purge || true
          rm -rf ~/hostedtoolcache/Python/3.13.15/arm64/lib/python3.13/site-packages/pip/_vendor 2>/dev/null || true
          df -h / | tail -1
          cd dist
          ditto -c -k --keepParent Shorts.app Shorts-macOS-arm64.zip
          hdiutil create -volname Shorts -srcfolder Shorts.app -ov -format UDZO Shorts-macOS-arm64.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-macOS-arm64
          path: |
            dist/Shorts-macOS-arm64.zip
            dist/Shorts-macOS-arm64.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build
        run: pyinstaller shorts_app.spec --noconfirm
      - name: Package
        shell: powershell
        run: Compress-Archive -Path dist/Shorts.exe -DestinationPath dist/Shorts-Windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-Windows-x64
          path: |
            dist/Shorts.exe
            dist/Shorts-Windows-x64.zip

  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shorts-macOS-arm64/Shorts-macOS-arm64.zip
            dist/Shorts-macOS-arm64/Shorts-macOS-arm64.dmg
            dist/Shorts-Windows-x64/Shorts.exe
            dist/Shorts-Windows-x64/Shorts-Windows-x64.zip
