name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# GITHUB_TOKEN 需要写权限才能给 tag 创建/更新 Release 并上传资产
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile OCR helper
        run: swiftc core/ocr_helper.swift -o core/ocr_helper -O
      - name: Build
        run: pyinstaller shorts_app.spec --noconfirm
      - name: Adhoc codesign
        run: codesign --force --deep --sign - dist/Shorts.app
      - name: Package zip + dmg
        run: |
          # GitHub macOS runner 上 hdiutil create -srcfolder 会报假 ENOSPC
          # (df 明明有 37G)——runner 沙箱下自动中介镜像挂载失败。社区标准
          # 解法：手动分步(显式大小挂空盘→cp→卸载→convert)。
          rm -rf build
          cd dist
          ditto -c -k --keepParent Shorts.app Shorts-macOS-arm64.zip
          rm -rf /tmp/dmgroot && mkdir -p /tmp/dmgroot
          ditto Shorts.app /tmp/dmgroot/Shorts.app
          SIZE=$(( $(du -sm /tmp/dmgroot | awk '{print $1}') * 2 + 100 ))
          hdiutil create -size ${SIZE}m -volname Shorts -fs HFS+ -ov -attach /tmp/scratch.dmg
          cp -R /tmp/dmgroot/Shorts.app /Volumes/Shorts/
          hdiutil detach /Volumes/Shorts
          hdiutil convert /tmp/scratch.dmg -format UDZO -o Shorts-macOS-arm64.dmg
          rm -f /tmp/scratch.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-macOS-arm64
          path: |
            dist/Shorts-macOS-arm64.zip
            dist/Shorts-macOS-arm64.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build
        run: pyinstaller shorts_app.spec --noconfirm
      - name: Package
        shell: powershell
        run: Compress-Archive -Path dist/Shorts.exe -DestinationPath dist/Shorts-Windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-Windows-x64
          path: |
            dist/Shorts.exe
            dist/Shorts-Windows-x64.zip

  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Shorts-macOS-arm64/Shorts-macOS-arm64.zip
            dist/Shorts-macOS-arm64/Shorts-macOS-arm64.dmg
            dist/Shorts-Windows-x64/Shorts.exe
            dist/Shorts-Windows-x64/Shorts-Windows-x64.zip
